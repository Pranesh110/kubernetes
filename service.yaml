#Node port service is used to expose the service to the external world. It will create a node port which will listen on a port and forward the traffic to the service. It will create a load balancer which will distribute the traffic to all the pods running the application.

apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: MyApp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376
      nodePort: 30080
#Here we have specified the node port as 30080 which will listen on this port and forward the traffic to the service on port 80 and then to the pod on port 9376. It will create a load balancer which will distribute the traffic to all the pods running the application.
#external will listen on port 30080 and forward the traffic to the service on port 80 and then to the pod on port 9376. It will create a load balancer which will distribute the traffic to all the pods running the application.

