#With service it will do loadbalancing service discovery and external expose
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  selector:
    app.kubernetes.io/name: MyApp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376
#port listening on 80 and target port is 9376 which is the port of the pod where the application is running. It will forward the traffic to the pod on port 9376.
#external will listen on port 80 and forward the traffic to the pod on port 9376. It will create a load balancer which will distribute the traffic to all the pods running the application.
#selector is used to select the pods which are running the application. It will select the pods which have the label app.kubernetes.io/name: MyApp. It will forward the traffic to all the pods which have this label.


#In deployment.yaml we have selector with label app: dev these selector is used in the service.yaml
Selector the label app: dev that send the req  as proto tcp and port 8000 and listen on 80
