#now svc type load balancer is used to expose the service to the external world. It will create a load balancer which will listen on a port and forward the traffic to the service. It will create a load balancer which will distribute the traffic to all the pods running the application.
apiVersion: v1
kind: Service 
metadata:
  name: my-service
spec:
  type: LoadBalancer  
  selector:
    app.kubernetes.io/name: MyApp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376

Now when we give kubectl get svc my-service it will show the external ip of the load balancer which we can use to access the application from the external world. It will create a load balancer which will distribute the traffic to all the pods running the application.
#but load balance is meant to be supported in cloud environment like aws, gcp, azure etc. It will create a load balancer which will distribute the traffic to all the pods running the application. But in minikube it will not work because minikube is running on local machine and it does not have any load balancer. So we can use node port service to expose the service to the external world. It will create a node port which will listen on a port and forward the traffic to the service. It will create a load balancer which will distribute the traffic to all the pods running the application.

#cluster ip bascially uses the cluster ip not worker node ip and user can use the app using the cluster ip but they need to inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: python-service
spec:
  type: ClusterIP
  selector:
    app: dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
1	Understanding the configuration
•	Field	•	Meaning
•	type: ClusterIP	•	Internal cluster access only
•	selector: app: dev	•	Selects your two Python Pods
•	port: 80	•	Service listening port
•	targetPort: 8000	•	Python application port inside the Pod
•	nodePort	•	Not required


If we use Node port a separate IP will be created and port that we mention will mapped
If we use cluster type a same cluster ip will be used
If we use loadbalancer A separate private and public ip will be created.
